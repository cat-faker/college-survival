<style>

{n:"Move-In Mayhem",intro:"Everything is new and nobody gave you a manual. Find the Peer Leader, then deal with the Lonely Ghost.",

 sq:{n:"Side Quest: Study Group",p:[3,12],t:"You form a study group with three classmates. You quiz each other and share notes.",f:{g:8,s:10,e:-5}}},
{n:"Community Quad",intro:"You’ve been here a while. Time to build your network and handle a missed deadline. Find the tutor!",

 sq:{n:"Side Quest: Connect Outside Your Major",p:[8,12],t:"You meet a student from a totally different major and trade study tips and stories.",f:{s:10,e:-3}}}];
const AMB=[{x:1,y:6,n:"Classmate",c:"#e57373",t:["Tip: read the syllabus on day one. Every due date is in there!","Tip: sit near the front. You’ll focus more and professors learn your name."]},

const S={};
function reset(){Object.assign(S,{e:70,g:50,s:20,lv:0,cr:0,pw:[],nd:0,od:0,sd:0,bh:100,px:152,py:120,mode:"title",t:0});AMB.forEach(m=>m.i=0)}
reset();
const fx=f=>{S.e=cl(S.e+(f.e||0));S.g=cl(S.g+(f.g||0));S.s=cl(S.s+(f.s||0));hud()};
const dstr=f=>["e","g","s"].filter(k=>f[k]).map(k=>({e:"Energy",g:"Grades",s:"Support"}[k])+" "+(f[k]>0?"+":"")+f[k]).join(", ");

 $("hud").innerHTML=b("Energy",S.e,"#66bb6a")+b("Grades",S.g,"#42a5f5")+b("Support",S.s,"#f48fb1")+`<span>Credits ${S.cr}</span><span style="flex-basis:100%">Power-ups: ${S.pw.join(", ")||"none yet"}</span>`}
function box(w,t,b){$("who").textContent=w;$("txt").textContent=t;const B=$("btns");B.innerHTML="";(b||[]).forEach(([l,f],i)=>{const e=document.createElement("button");e.textContent=(b.length>1?(i+1)+". ":"")+l;e.onclick=f;B.appendChild(e)})}
function say(w,L,cb){cb=cb||walk;let i=0;const n=()=>{if(i>=L.length){cb();return}const last=i===L.length-1;box(w,L[i++],[[last?"OK":"Next ▶",n]])};n()}
function walk(){S.mode="walk";const L=LV[S.lv];hud();
 if(L)box("LEVEL "+(S.lv+1)+": "+L.n,`Goal: talk to ${L.npc.n} ${S.nd?"[done]":"(!)"} and beat the ${L.ob.n} ${S.od?"[done]":""}. Optional: ${L.sq.n} ${S.sd?"[done]":"(star)"}. Walk up to someone and press A or Space.`);
 else box("FINALS WEEK","Walk to the Finals Week Dragon in the middle of campus and face it!")}
function startLevel(){const L=LV[S.lv];say("LEVEL "+(S.lv+1)+": "+L.n,[L.intro])}

function fight(){const o=LV[S.lv].ob;S.mode="talk";const opts=o.o.slice().sort(()=>Math.random()-.5);

function quest(){const q=LV[S.lv].sq;S.mode="talk";if(S.sd)say(q.n,["You already finished this side quest."]);else say(q.n,[q.t],()=>{fx(q.f);S.sd=1;say("SIDE QUEST DONE!",["Bonus: "+dstr(q.f)])})}
function boss(){S.mode="battle";say("FINALS WEEK DRAGON",["ROAR! I am Burnout. I feed on all-nighters, skipped meals, and students who never ask for help!","Use your power-ups wisely and watch your energy!"],turn)}
function turn(){hud();const has=p=>S.pw.includes(p),M=[["Study (-8 energy)",()=>mv(12+Math.floor(S.s/10),-8,"You hit the books.")]];

 if(has("Office Hours Pass"))M.push(["Office Hours: Ask for Help",()=>mv(22,-10,"A professor clears up your hardest topic.")]);
 if(has("Study Group Badge"))M.push(["Study Group: Team Up",()=>mv(22,-8,"Your study group has your back.")]);
 if(has("Self-Care Kit"))M.push(["Self-Care: Rest and Recharge",()=>mv(0,25,"You sleep, eat, and take a walk.")]);
 box("Dragon HP "+S.bh+"/100  |  Your Energy "+S.e,"Choose your move:",M)}

 if(S.bh<=0){win();return}say("YOU",[m+(d?" The dragon takes "+d+" damage!":" You feel recharged!")],dragon)}
function dragon(){S.e=cl(S.e-10);hud();

 else say("DRAGON",[BOSSHIT[Math.floor(Math.random()*3)]+" You lose 10 energy."],turn)}
function win(){S.mode="end";say("VICTORY!",["The Burnout Dragon is defeated! You made it through your first semester.",
 "Accomplishments: (1) You passed your classes. (2) You built a support network. (3) You got involved on campus.",
 "Skill you developed: time management, and asking for help early.",
 "Lesson for sophomore year: asking for help is a strength, not a weakness.",
 "Keep building relationships with: your advisor, your professors, your peer leader, and your study group."],
 ()=>box("YOU UNLOCKED COLLEGE!",`Credits earned: ${S.cr}. Energy ${S.e}, Grades ${S.g}, Support ${S.s}. Power-ups: ${S.pw.join(", ")}.`,[["Play again",()=>{reset();hud();title()}]]))}
function title(){S.mode="title";box("UNIV 101: COLLEGE UNLOCKED","A first-year survival game. Five levels, hidden power-ups, a support network, and one final boss.",[["START GAME",start]])}
function ents(){const a=[],L=LV[S.lv];
 if(L){a.push({k:"npc",x:L.npc.p[0],y:L.npc.p[1],c:L.npc.c,m:!S.nd,go:talk});
  if(!S.od)a.push({k:"ob",x:L.ob.p[0],y:L.ob.p[1],go:fight});

 let dx=(K.arrowright||K.d?1:0)-(K.arrowleft||K.a?1:0),dy=(K.arrowdown||K.s?1:0)-(K.arrowup||K.w?1:0);if(dx&&dy){dx*=.7;dy*=.7}

 if(S.mode==="title"){R(0,60,320,90,"rgba(27,42,90,.85)");tx("UNIV 101",160,95,"#f5c518",18);tx("COLLEGE UNLOCKED",160,122,"#fff",10);tx("A first-year survival game",160,140,"#bbb",7)}
 requestAnimationFrame(draw)}
addEventListener("keydown",e=>{const k=e.key.toLowerCase();K[k]=1;
